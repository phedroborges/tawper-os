# Configuração do projeto local / CLI do Tawper OS.
# Não contém segredos. URL, chaves e senhas entram só por variável de ambiente.

project_id = "tawper-os"

[api]
enabled = true
port = 54321
schemas = ["public", "app", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://localhost:4100"
additional_redirect_urls = ["http://localhost:4100"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[realtime]
enabled = false
